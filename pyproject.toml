[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retrodoc"
version = "0.1.0"
description = "Documentation automatique d'un dépôt Java : analyse tree-sitter, diagramme de classes Mermaid et résumés par LLM."
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-java>=0.23",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
retrodoc = "retrodoc.cli:main"

[tool.setuptools]
packages = ["retrodoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
