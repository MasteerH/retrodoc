name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check retrodoc tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      # Les tests n'appellent jamais un vrai LLM : il est remplacé par un faux client.
      - run: pytest --cov=retrodoc --cov-report=term-missing --cov-fail-under=80

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t retrodoc .
      # Vérifie que le conteneur démarre et que l'API répond.
      - run: |
          docker run -d --name retrodoc -p 8000:8000 retrodoc
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/docs > /dev/null && exit 0
            sleep 1
          done
          docker logs retrodoc
          exit 1
